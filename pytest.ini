# pytest.ini = pengaturan pytest untuk proyek ini. Dibaca otomatis setiap kali menjalankan `pytest`.
[pytest]
# Folder tempat pytest mencari test
testpaths = tests

# Opsi yang SELALU ditambahkan di belakang perintah pytest:
#   -v                              tampilkan nama tiap test
#   --tracing=retain-on-failure     rekam jalannya test; simpan file trace HANYA kalau test gagal (playwright-report/traces/)
#   -m "not consumes_tokens ..."    run default aman: lewati test yang memakai token / mengubah data permanen
#   --html=... --self-contained-html  buat laporan HTML di playwright-report/index.html (dibuka dengan: npx playwright show-report)
addopts = -v --tracing=retain-on-failure -m "not consumes_tokens and not destructive" --html=playwright-report/index.html --self-contained-html

# Daftar "stiker" (marker) yang boleh dipakai. Dipakai untuk memilih test: pytest -m dashboard
markers =
    tc(id): ID test case di Google Sheet (mis. E2E-03-10)
    consumes_tokens: memakai token AI asli
    destructive: mengubah/menghabiskan data permanen (onboarding, post terjadwal, dll)
    auth: login dan register
    onboarding: onboarding
    dashboard: dashboard
    composer: content composer
    assistant: AI assistant
    image: image generator
    video: video generator
    seo: SEO
    media_library: media library
    brand_hub: brand hub
    campaign: campaign
    billing: billing
    jira: test case dari tiket Jira project RO (Refactor - Optimark Digital Marketing)
